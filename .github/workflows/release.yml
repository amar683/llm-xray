name: Release

# Builds installers for all three operating systems when a version tag is
# pushed, and attaches them to a draft GitHub release.
#
# Signing is optional: without the secrets below the installers are built
# unsigned (macOS and Windows will warn users on first launch). See
# docs/release.md for what each secret is and how to get it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Pushes to main test on Linux only, so this is where macOS and Windows get
  # the full test suite: every release is checked on all three systems.
  smoke:
    name: Tests and smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q
      # Smoke test with --no-dev: exactly the packages the installed app gets.
      - run: uv sync --locked --no-dev
      - run: uv run --no-dev python scripts/smoke.py

  installers:
    name: Installer (${{ matrix.os }})
    needs: smoke
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: app
      # macOS signing and notarization are optional. An unset secret still reaches
      # the build as an empty variable, and Tauri then tries (and fails) to sign
      # with an empty certificate, so only the secrets that exist are passed on.
      - name: Apple signing settings (only those that are configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set_count=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
              set_count=$((set_count + 1))
            fi
          done
          if [ "$set_count" -eq 0 ]; then echo "No Apple signing secrets: building an unsigned app."; fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: LLM X-Ray ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
